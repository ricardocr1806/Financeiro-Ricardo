<title>Financeiro Laura &amp; Ricardo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Outfit:wght@200;300;400&display=swap">
<style>
/* Layout: barra lateral fixa à esquerda, coluna de cartões no centro e barra de status presa ao rodapé, como um painel de controle de caixa. */
:root {
  color-scheme: dark;
  --bg: #0b110e;
  --side: #0d1411;
  --surface: #111a16;
  --surface-2: #15211b;
  --line: #1e2c25;
  --line-2: #2a3b33;
  --fg: #e9eeea;
  --muted: #9aaba1;
  --faint: #66776d;
  --accent: #e2c46b;
  --accent-ink: #1a1404;
  --good: #72d095;
  --bad: #ec8a70;
  --warn: #e7a849;
  --good-bg: rgba(114, 208, 149, .1);
  --bad-bg: rgba(236, 138, 112, .1);
  --warn-bg: rgba(231, 168, 73, .1);
  --accent-bg: rgba(226, 196, 107, .1);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --shadow: 0 1px 0 rgba(255,255,255,.02) inset, 0 12px 30px -18px rgba(0,0,0,.6);
  --f-body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-display: "Outfit", "Manrope", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --side-w: 300px;
  --bar-h: 76px;
  --r: 18px;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #eef2ee; --side: #e6ece7; --surface: #fbfcfa; --surface-2: #f2f6f2;
    --line: #dbe3dc; --line-2: #c7d3ca; --fg: #12201a; --muted: #4f6158; --faint: #7a8a81;
    --accent: #9a7615; --accent-ink: #fffaf0;
    --good: #1f7d45; --bad: #b8472e; --warn: #9a6200;
    --good-bg: rgba(31,125,69,.09); --bad-bg: rgba(184,71,46,.08); --warn-bg: rgba(154,98,0,.09); --accent-bg: rgba(154,118,21,.1);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --shadow: 0 10px 30px -22px rgba(20,40,30,.35);
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #eef2ee; --side: #e6ece7; --surface: #fbfcfa; --surface-2: #f2f6f2;
  --line: #dbe3dc; --line-2: #c7d3ca; --fg: #12201a; --muted: #4f6158; --faint: #7a8a81;
  --accent: #9a7615; --accent-ink: #fffaf0;
  --good: #1f7d45; --bad: #b8472e; --warn: #9a6200;
  --good-bg: rgba(31,125,69,.09); --bad-bg: rgba(184,71,46,.08); --warn-bg: rgba(154,98,0,.09); --accent-bg: rgba(154,118,21,.1);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --shadow: 0 10px 30px -22px rgba(20,40,30,.35);
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num, td.v, .tab { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--f-mono); }
.eyebrow { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.pos { color: var(--good); } .neg { color: var(--bad); } .gold { color: var(--accent); } .warn { color: var(--warn); }
.muted { color: var(--muted); } .faint { color: var(--faint); }
h1, h2, h3 { margin: 0; text-wrap: balance; }

/* ---------- esqueleto ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px));
  background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column;
  padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
}
.brand { display: flex; align-items: center; gap: 14px; padding: 30px 8px 26px; border-bottom: 1px solid var(--line); margin: 0 -14px 0 calc(-1 * max(14px, env(safe-area-inset-left, 0px))); padding-left: max(22px, env(safe-area-inset-left, 0px)); }
.brand .mark { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-mono); font-weight: 600; font-size: 13px; color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); background: radial-gradient(circle at 30% 30%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 70%); flex: none; }
.brand .eyebrow { font-size: 11px; }
.brand .nm { font-family: var(--f-display); font-weight: 300; font-size: 29px; line-height: 1.05; letter-spacing: .01em; }
.nav { display: flex; flex-direction: column; gap: 4px; padding: 22px 0; overflow-y: auto; flex: 1; }
.nav button {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; border: 1px solid transparent; background: none;
  padding: 12px 16px; border-radius: 14px; font-size: 16.5px; font-weight: 500; color: var(--fg); opacity: .86;
}
.nav button:hover { background: var(--surface); opacity: 1; }
.nav button[aria-current="page"] { background: var(--surface-2); border-color: var(--line-2); color: var(--accent); opacity: 1; font-weight: 600; }
.nav svg { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.nav .badge { margin-left: auto; font-family: var(--f-mono); font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--bad-bg); color: var(--bad); font-weight: 600; }
.whoami { margin: 0 0 16px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); }
.whoami .st { display: flex; align-items: center; gap: 8px; font-family: var(--f-mono); font-size: 11px; letter-spacing: .18em; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px var(--good-bg); flex: none; }
.dot.off { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-bg); }
.dot.err { background: var(--bad); box-shadow: 0 0 0 3px var(--bad-bg); }
.whoami .n { font-weight: 700; font-size: 18px; margin-top: 8px; }
.whoami .s { color: var(--muted); font-size: 13.5px; }

.main { min-width: 0; padding-block: 28px calc(var(--bar-h) + 40px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.topbar { display: none; }

.pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.pagehead h1 { font-family: var(--f-display); font-weight: 300; font-size: clamp(28px, 4vw, 40px); letter-spacing: .005em; line-height: 1.1; }
.pagehead p { margin: 6px 0 0; color: var(--muted); max-width: 62ch; }
.mesnav { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); border-radius: 99px; padding: 4px; background: var(--surface); }
.mesnav button { border: none; background: none; width: 34px; height: 34px; border-radius: 50%; color: var(--muted); font-size: 18px; }
.mesnav button:hover { background: var(--surface-2); color: var(--fg); }
.mesnav span { font-family: var(--f-mono); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; min-width: 150px; text-align: center; }

/* ---------- cartões ---------- */
.card { background: linear-gradient(180deg, var(--surface-2), var(--surface) 140px); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card > .hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 22px 26px; border-bottom: 1px solid var(--line); }
.card > .bd { padding: 22px 26px; }
.card > .bd.flush { padding: 0; }
.grid { display: grid; gap: 22px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.span2 { grid-column: span 2; }

.kpi { padding: 18px 22px 20px; display: flex; flex-direction: column; gap: 4px; }
.kpi .t { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.kpi .l { font-size: 15px; font-weight: 500; }
.kpi .v { font-weight: 700; font-size: 17px; white-space: nowrap; }
.kpi .big { font-family: var(--f-display); font-weight: 300; font-size: clamp(21px, 2.6vw, 34px); line-height: 1.1; margin-top: 6px; letter-spacing: -.01em; }
.kpi .sub { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); letter-spacing: .06em; line-height: 1.55; }
.kpi button.link { align-self: flex-start; }

/* demonstrativo estilo DRE */
.dre { display: flex; flex-direction: column; }
.dre .row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 11px 0; font-size: 17px; }
.dre .row .v { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dre .row.b { font-weight: 700; }
.dre .row.tot { border-top: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); padding: 20px 0; margin: 10px 0; font-size: 19px; font-weight: 700; }
.dre .row.tot .v { font-size: 25px; }
.dre .row.sm { font-size: 15.5px; padding: 8px 0 8px 20px; }
.dre .row.sm .v { font-weight: 500; }
.dre .sec { margin-top: 18px; margin-bottom: 4px; }

/* listas de lembrete */
.lst { display: flex; flex-direction: column; }
.it { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
.it:first-child { border-top: none; }
.it .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-mono); font-size: 15px; }
.it .ic.in { background: var(--good-bg); color: var(--good); }
.it .ic.out { background: var(--bad-bg); color: var(--bad); }
.it .nm { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.it .meta { font-size: 13px; color: var(--muted); }
.it .val { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }

.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .04em; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
.chip.bad { background: var(--bad-bg); border-color: color-mix(in srgb, var(--bad) 35%, transparent); color: var(--bad); }
.chip.good { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 35%, transparent); color: var(--good); }
.chip.warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 35%, transparent); color: var(--warn); }
.chip.gold { background: var(--accent-bg); border-color: color-mix(in srgb, var(--accent) 35%, transparent); color: var(--accent); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface-2); padding: 8px 14px; border-radius: 11px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.pri:hover { filter: brightness(1.06); }
.btn.sm { padding: 5px 10px; font-size: 13px; border-radius: 9px; }
.btn.ok { color: var(--good); }
.btn.danger { color: var(--bad); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
button.link { border: none; background: none; padding: 0; color: var(--accent); font-weight: 600; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.tg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 11px; overflow: hidden; flex: none; }
.tg button { border: none; background: none; padding: 7px 12px; font-size: 13px; font-weight: 600; color: var(--faint); white-space: nowrap; }
.tg button + button { border-left: 1px solid var(--line-2); }
.tg button[aria-pressed="false"]:hover { color: var(--fg); background: var(--surface-2); }
.tg button[aria-pressed="true"] { cursor: default; }
.tg .tg-p[aria-pressed="true"] { background: var(--bad-bg); color: var(--bad); }
.tg .tg-ok[aria-pressed="true"] { background: var(--good-bg); color: var(--good); }
.row-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }

/* tabelas */
.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14.5px; }
table.t th { text-align: left; font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--faint); font-weight: 500; padding: 12px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t td { padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.t tr:last-child td { border-bottom: none; }
table.t td.v, table.t th.v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.t tr.grp td { background: var(--surface-2); font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); padding: 9px 14px; }
table.t tr.tot td { font-weight: 700; border-top: 1px solid var(--line-2); }
table.t td .nota { display: block; font-size: 12.5px; color: var(--faint); max-width: 52ch; }
.inp { background: var(--bg); border: 1px solid var(--line-2); border-radius: 9px; padding: 6px 10px; width: 100%; min-width: 0; }
.inp:focus { border-color: var(--accent); outline: none; }
.inp.v { text-align: right; font-variant-numeric: tabular-nums; max-width: 130px; }
.inp.d { max-width: 70px; text-align: center; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); min-width: 0; }
.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
tr.edit td { background: var(--surface-2); }

/* barras horizontais */
.bars { display: flex; flex-direction: column; gap: 4px; }
.bar { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 2fr) auto; gap: 14px; align-items: center; padding: 8px 6px; border-radius: 10px; border: none; background: none; text-align: left; width: 100%; }
button.bar:hover { background: var(--surface-2); }
.bar.sel { background: var(--surface-2); outline: 1px solid var(--line-2); }
.bar .bn { font-weight: 600; font-size: 14.5px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .bn small { display: block; font-weight: 400; color: var(--faint); font-size: 12px; }
.bar .tr, .bar .fl, .bar .bn, .bar .bv { display: block; }
.bar .tr { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar .fl { height: 100%; border-radius: 99px; background: var(--accent); min-width: 2px; }
.bar .fl.emp { background: var(--s1); }
.bar .bv { font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 14.5px; }
.bar .bv small { display: block; font-weight: 500; color: var(--faint); font-size: 12px; }

.stack { display: flex; height: 16px; border-radius: 99px; overflow: hidden; gap: 2px; background: var(--line); }
.stack span { display: block; height: 100%; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

/* gráficos */
.chart { position: relative; width: 100%; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.chart .ax { fill: var(--faint); font-family: var(--f-mono); font-size: 11px; }
.chart .lbl { fill: var(--fg); font-family: var(--f-body); font-size: 12.5px; font-weight: 700; }
.chart .lbl2 { fill: var(--muted); font-family: var(--f-body); font-size: 11.5px; font-weight: 500; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .zero { stroke: var(--line-2); stroke-width: 1.5; }
.chart .xh { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 12px; font-size: 13px; box-shadow: 0 14px 30px -12px rgba(0,0,0,.5); min-width: 170px; max-width: 280px; }
.tip b { display: block; font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
.tip .r { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }
.tip .r i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; }

/* gargalos */
.garg { display: grid; grid-template-columns: 6px minmax(0, 1fr); gap: 0 18px; padding: 20px 24px; border-top: 1px solid var(--line); }
.garg:first-child { border-top: none; }
.garg .sv { border-radius: 99px; background: var(--line-2); grid-row: span 3; }
.garg.critico .sv { background: var(--bad); } .garg.atencao .sv { background: var(--warn); } .garg.ok .sv { background: var(--good); }
.garg .gt { display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; align-items: baseline; }
.garg h3 { font-size: 17.5px; font-weight: 700; }
.garg .gn { font-family: var(--f-display); font-weight: 300; font-size: 26px; white-space: nowrap; }
.garg p { margin: 6px 0 0; color: var(--muted); max-width: 78ch; }
.garg .acao { margin-top: 10px; font-size: 14px; display: flex; gap: 10px; align-items: baseline; }
.garg .acao b { font-family: var(--f-mono); font-size: 11px; letter-spacing: .16em; color: var(--accent); text-transform: uppercase; font-weight: 600; white-space: nowrap; }

/* agenda */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .wd { font-family: var(--f-mono); font-size: 11px; letter-spacing: .14em; color: var(--faint); text-align: center; padding-bottom: 4px; }
.cal button.day { min-height: 92px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal button.day:hover { border-color: var(--line-2); }
.cal .day.vazio { visibility: hidden; }
.cal .day .dn { font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); }
.cal .day.hoje { border-color: var(--accent); }
.cal .day.hoje .dn { color: var(--accent); font-weight: 600; }
.cal .day.sel { background: var(--surface-2); outline: 1px solid var(--accent); }
.cal .day .a { font-size: 12px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cal .day .late { width: 6px; height: 6px; border-radius: 50%; background: var(--bad); display: inline-block; margin-left: 4px; vertical-align: 2px; }

/* importar */
.drop { border: 1.5px dashed var(--line-2); border-radius: var(--r); padding: 40px 24px; text-align: center; background: var(--surface); display: flex; flex-direction: column; align-items: center; gap: 10px; transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-bg); }
.drop .ico { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--accent-bg); color: var(--accent); }
.drop h2 { font-family: var(--f-display); font-weight: 300; font-size: 26px; }
.drop p { margin: 0; color: var(--muted); max-width: 60ch; }
select.inp { padding-right: 26px; }
.sel-cat { max-width: 230px; }

/* barra de status */
.statusbar {
  position: fixed; left: var(--side-w); right: 0; bottom: 0; z-index: 20; min-height: var(--bar-h);
  background: color-mix(in srgb, var(--side) 92%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  display: flex; align-items: center; gap: 22px; flex-wrap: nowrap; overflow: hidden;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px));
}
